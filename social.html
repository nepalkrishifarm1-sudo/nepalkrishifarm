<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nepal Krishi Tatha Pasupanchi Farm | Social Links</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --forest: #1B4D2E;
    --leaf:   #3A7D44;
    --lime:   #8DC63F;
    --cream:  #F9F5EC;
    --earth:  #C4843A;
    --dark:   #0F2A19;
    --text:   #1E1E1E;
    --muted:  #5A6E5C;
    --ig: linear-gradient(135deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);
    --fb:#1877F2;
    --tt-bg:#000000;
    --yt:#FF0000;
    --wa:#25D366;
    --radius:24px;
    --gap:18px;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(135deg, rgba(15,42,25,0.92) 0%, rgba(27,77,46,0.85) 60%, rgba(45,107,58,0.8) 100%),
      var(--dark);
    font-family:'Inter', sans-serif;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:360px;
    text-align:center;
  }

  .logo{
    width:88px;
    height:88px;
    border-radius:50%;
    object-fit:cover;
    background:var(--cream);
    border:3px solid rgba(141,198,63,.4);
    box-shadow:0 4px 20px rgba(0,0,0,0.35);
    margin-bottom:18px;
  }

  .tag{
    display:inline-block;
    background:rgba(141,198,63,.15);
    border:1px solid rgba(141,198,63,.4);
    color:var(--lime);
    font-size:.72rem; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase;
    padding:6px 16px; border-radius:30px;
    margin-bottom:14px;
  }

  h1{
    font-family:'Playfair Display', serif;
    color:var(--cream);
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:0.3px;
    margin:0 0 6px;
  }

  h1 span{ color:var(--lime); }

  p.sub{
    color:rgba(249,245,236,0.75);
    font-size:13px;
    margin:0 0 26px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:var(--gap);
  }

  .tile{
    aspect-ratio:1/1;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    color:#fff;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.2px;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
  }

  .tile:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 26px rgba(141,198,63,.25);
  }

  .tile:active{
    transform:translateY(0);
  }

  .tile svg{
    width:32px;
    height:32px;
  }

  .instagram{ background:var(--ig); }
  .facebook{ background:var(--fb); }
  .whatsapp{ background:var(--wa); }
  .tiktok{ background:var(--tt-bg); border:1px solid #2a2a2a; }
  .youtube{ background:var(--yt); }
  .website{ background:var(--leaf); border:1px solid rgba(141,198,63,.4); }

  footer{
    margin-top:28px;
    color:rgba(249,245,236,0.5);
    font-size:11px;
    letter-spacing:.04em;
  }

  @media (max-width:360px){
    .tile{ font-size:12.5px; }
    .tile svg{ width:26px; height:26px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <img class="logo" src="logo.png" alt="Nepal Krishi Tatha Pasupanchi Farm Logo">
   <h1>Nepal Krishi <span>Tatha Pasupanchi Farm</span></h1>
  <div class="tag">Jhapa · Nepal</div>

    <!-- Instagram -->
    <a class="tile instagram" href="https://instagram.com/nepal.krishi.farm" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="white" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.6" stroke="white" stroke-width="1.8"/>

    <a class="tile website" href="https://www.nepalkrishifarm.com.np" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9.2" stroke="white" stroke-width="1.8"/>
        <path d="M2.8 12h18.4M12 2.8c2.6 2.6 4 5.8 4 9.2s-1.4 6.6-4 9.2c-2.6-2.6-4-5.8-4-9.2s1.4-6.6 4-9.2z" stroke="white" stroke-width="1.8"/>

  </div>

  <footer>© Nepal Krishi Tatha Pasupanchi Farm</footer>
</div>

</body>
</html>
